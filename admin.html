<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Designer Admin | Von Visual Designs</title>
<style>
:root{--ink:#17191d;--muted:#69707b;--line:#e5e7eb;--accent:#6657e8;--bg:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}header{background:#111318;color:white;padding:18px 24px}.inner,main{max-width:1050px;margin:auto}.brand{font-weight:800;letter-spacing:.08em;font-size:14px}main{padding:30px 18px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}h1{font-size:30px;margin:0 0 8px}h2{font-size:20px;margin:0 0 14px}p{color:var(--muted)}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #cfd3dc;border-radius:9px;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:9px;background:var(--accent);color:white;font:inherit;font-weight:700;padding:11px 15px;cursor:pointer}button.secondary{background:#ececf5;color:#25263a}button.danger{background:#a92d3b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hidden{display:none!important}.notice{padding:12px;border-radius:9px;background:#f0efff;color:#39318a;margin:12px 0}.error{background:#fff0f0;color:#9a2222}.project{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.projectTop{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.bar{height:8px;background:#eceef3;border-radius:99px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:var(--accent)}small,.muted{color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:20px 12px}.card{padding:17px}}
</style>
</head><body>
<header><div class="inner"><div class="brand">VON VISUAL DESIGNS · ADMIN</div></div></header>
<main>
<section id="login" class="card"><h1>Designer sign in</h1><p>Use your authorized designer email. A one-time code will be sent to you.</p><div id="msg" class="notice hidden"></div><form id="sendForm"><label>Email</label><input id="adminEmail" type="email" required placeholder="isaac@vonvisualdesigns.com"><p><button type="submit" id="sendBtn">Send login code</button></p></form><form id="verifyForm" class="hidden"><label>6-digit code</label><input id="adminCode" inputmode="numeric" maxlength="6" required><p><button type="submit" id="verifyBtn">Verify and open admin</button></p></form></section>
<section id="app" class="hidden">
<div class="card"><div class="projectTop"><div><h1>Client projects</h1><p>Add a project or update progress. Clients sign in using the email address assigned to their project.</p></div><button class="secondary" id="logout">Log out</button></div><div id="appMsg" class="notice hidden"></div></div>
<div class="card"><h2 id="formTitle">Add a client project</h2><form id="projectForm">
<input id="projectId" type="hidden">
<div class="grid"><div><label>Client name (optional)</label><input id="clientName" placeholder="Client name"></div><div><label>Client email</label><input id="clientEmail" type="email" required placeholder="client@example.com"></div></div>
<label>Project / website name</label><input id="projectName" required placeholder="Example: Smith Family Dentistry Website">
<label>Short description (optional)</label><input id="description" placeholder="A new, mobile-friendly business website">
<div class="grid"><div><label>Progress: <span id="pctLabel">0</span>%</label><input id="progress" type="range" min="0" max="100" value="0"></div><div><label>Project stage</label><select id="stage"><option>Getting started</option><option>Design</option><option>Development</option><option>Content and revisions</option><option>Testing</option><option>Ready for launch</option><option>Launched</option></select></div></div>
<label>Progress notes (visible to client)</label><textarea id="notes" placeholder="Example: Homepage design is complete. I'm working on the services page next."></textarea>
<div class="grid"><div><label>Designer name</label><input id="designerName" value="Isaac" required></div><div><label>Designer email</label><input id="designerEmail" type="email" value="isaac@vonvisualdesigns.com" required></div></div>
<p class="row"><button id="saveBtn" type="submit">Save project</button><button class="secondary hidden" id="cancelEdit" type="button">Cancel edit</button></p>
</form></div>
<div class="card"><h2>Saved projects</h2><div id="projects"><p>Loading projects…</p></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* SET THESE TWO VALUES using your Supabase project settings. */
const SUPABASE_URL="https://heuhurmkhprchbmkqbjq.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_c_TzeE0nVQ-CpQT4KXSPHw_rh8shJOv";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);let email="";
function msg(text,error=false){$("msg").textContent=text;$("msg").classList.remove("hidden");$("msg").classList.toggle("error",error)}
function appMsg(text,error=false){$("appMsg").textContent=text;$("appMsg").classList.remove("hidden");$("appMsg").classList.toggle("error",error)}
$("progress").addEventListener("input",()=>{$("pctLabel").textContent=$("progress").value});
$("sendForm").addEventListener("submit",async e=>{e.preventDefault();if(SUPABASE_URL.startsWith("YOUR_")||SUPABASE_ANON_KEY.startsWith("YOUR_")){msg("Setup needed: add your Supabase URL and anon key in this file.",true);return}email=$("adminEmail").value.trim().toLowerCase();$("sendBtn").disabled=true;const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});$("sendBtn").disabled=false;if(error){msg(error.message,true);return}$("sendForm").classList.add("hidden");$("verifyForm").classList.remove("hidden");msg("Code sent. Check your email.");});
$("verifyForm").addEventListener("submit",async e=>{e.preventDefault();$("verifyBtn").disabled=true;const {data,error}=await sb.auth.verifyOtp({email,token:$("adminCode").value.trim(),type:"email"});$("verifyBtn").disabled=false;if(error){msg("Code invalid or expired. Try again.",true);return}const {data:allowed,error:roleErr}=await sb.rpc("is_von_admin");if(roleErr||!allowed){await sb.auth.signOut();msg("This email is not authorized for the admin portal.",true);return}$("login").classList.add("hidden");$("app").classList.remove("hidden");await refresh();});
function resetForm(){$("projectForm").reset();$("projectId").value="";$("progress").value=0;$("pctLabel").textContent="0";$("designerName").value="Isaac";$("designerEmail").value="isaac@vonvisualdesigns.com";$("formTitle").textContent="Add a client project";$("saveBtn").textContent="Save project";$("cancelEdit").classList.add("hidden")}
$("cancelEdit").addEventListener("click",resetForm);
$("projectForm").addEventListener("submit",async e=>{e.preventDefault();const id=$("projectId").value;const payload={client_name:$("clientName").value.trim(),client_email:$("clientEmail").value.trim().toLowerCase(),project_name:$("projectName").value.trim(),description:$("description").value.trim(),progress_percent:Number($("progress").value),stage:$("stage").value,progress_notes:$("notes").value.trim(),designer_name:$("designerName").value.trim(),designer_email:$("designerEmail").value.trim().toLowerCase(),updated_at:new Date().toISOString()};$("saveBtn").disabled=true;let result=id?await sb.from("projects").update(payload).eq("id",id):await sb.from("projects").insert(payload);$("saveBtn").disabled=false;if(result.error){appMsg(result.error.message,true);return}appMsg(id?"Project updated.":"Project saved.");resetForm();await refresh();});
async function refresh(){const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});if(error){$("projects").innerHTML="";appMsg(error.message,true);return}if(!data.length){$("projects").innerHTML="<p>No projects yet. Add your first client above.</p>";return}$("projects").innerHTML="";for(const p of data){const el=document.createElement("div");el.className="project";const top=document.createElement("div");top.className="projectTop";const left=document.createElement("div");const title=document.createElement("strong");title.textContent=p.project_name;const detail=document.createElement("p");detail.textContent=(p.client_name?p.client_name+" · ":"")+p.client_email;detail.style.margin="4px 0";left.append(title,detail);const right=document.createElement("div");right.className="row";const edit=document.createElement("button");edit.className="secondary";edit.textContent="Edit";edit.onclick=()=>editProject(p);const del=document.createElement("button");del.className="danger";del.textContent="Delete";del.onclick=()=>deleteProject(p.id);right.append(edit,del);top.append(left,right);const status=document.createElement("div");status.textContent=`${p.progress_percent}% · ${p.stage||"In progress"}`;const bar=document.createElement("div");bar.className="bar";const fill=document.createElement("span");fill.style.width=Math.max(0,Math.min(100,Number(p.progress_percent)||0))+"%";bar.append(fill);const note=document.createElement("small");note.textContent=p.progress_notes||"No progress note yet.";el.append(top,status,bar,note);$("projects").append(el)}}
function editProject(p){$("projectId").value=p.id;$("clientName").value=p.client_name||"";$("clientEmail").value=p.client_email;$("projectName").value=p.project_name;$("description").value=p.description||"";$("progress").value=p.progress_percent||0;$("pctLabel").textContent=$("progress").value;$("stage").value=p.stage||"Getting started";$("notes").value=p.progress_notes||"";$("designerName").value=p.designer_name||"Isaac";$("designerEmail").value=p.designer_email||"isaac@vonvisualdesigns.com";$("formTitle").textContent="Edit client project";$("saveBtn").textContent="Update project";$("cancelEdit").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
async function deleteProject(id){if(!confirm("Delete this project? This cannot be undone."))return;const {error}=await sb.from("projects").delete().eq("id",id);if(error){appMsg(error.message,true);return}appMsg("Project deleted.");await refresh()}
$("logout").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});
(async()=>{if(!SUPABASE_URL.startsWith("YOUR_")){const {data}=await sb.auth.getSession();if(data.session?.user){const {data:allowed}=await sb.rpc("is_von_admin");if(allowed){$("login").classList.add("hidden");$("app").classList.remove("hidden");await refresh()}}}})();
</script></body></html>
